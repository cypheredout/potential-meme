<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aegis: Solara Theme Engine</title>
    <style>
        :root {
            --bg: #2D333B;
            --surf: #3D444D;
            --text: #E1E4E8;
            --pri: #10B981;
            --sec: #B388FF;
            --font-main: system-ui, -apple-system, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-main);
            background-color: #0d1117;
            color: #c9d1d9;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem;
            min-height: 100vh;
        }

        h1 {
            margin-bottom: 0.5rem;
            font-weight: 600;
        }

        p.subtitle {
            color: #8b949e;
            margin-bottom: 2rem;
        }

        /* Controls Area */
        .controls {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 12px;
            padding: 1.5rem;
            display: flex;
            gap: 1.5rem;
            margin-bottom: 2rem;
            flex-wrap: wrap;
            justify-content: center;
            width: 100%;
            max-width: 800px;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        label {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #8b949e;
            font-weight: 600;
        }

        select {
            background: #0d1117;
            color: #c9d1d9;
            border: 1px solid #30363d;
            padding: 0.75rem 1rem;
            border-radius: 8px;
            font-size: 1rem;
            outline: none;
            cursor: pointer;
            min-width: 200px;
        }

        select:focus {
            border-color: #10B981;
        }

        /* App Mockup Layout */
        .preview-container {
            display: flex;
            gap: 3rem;
            flex-wrap: wrap;
            justify-content: center;
            width: 100%;
            max-width: 1000px;
        }

        .phone-mockup {
            width: 375px;
            height: 750px;
            border-radius: 40px;
            border: 8px solid #30363d;
            background: var(--bg);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
            transition: background 0.4s ease;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }

        /* Mockup Top Bar */
        .mockup-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.5rem 1.25rem 1rem;
            background: var(--bg);
            transition: background 0.4s ease;
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.9rem;
            color: var(--text);
            font-weight: 600;
        }

        .dot {
            width: 10px;
            height: 10px;
            background: var(--pri);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--pri);
        }

        .phase-pill {
            background: var(--surf);
            color: var(--text);
            padding: 0.3rem 0.8rem;
            border-radius: 12px;
            font-size: 0.8rem;
            font-weight: 600;
            border: 1px solid rgba(255,255,255,0.05);
        }
